<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Cycle – WebVR Educational App</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b3a5c 50%, #2a5f8f 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e0f0ff;
      transition: opacity 0.8s ease;
    }
    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    #loading-overlay h1 { font-size: 2.2rem; margin-bottom: 0.3em; letter-spacing: 2px; }
    #loading-overlay p  { font-size: 1rem; opacity: 0.7; margin-bottom: 2em; }
    .loader { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.15);
              border-top-color: #64b5f6; border-radius: 50%;
              animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Controls help overlay */
    #controls-help {
      position: fixed; bottom: 16px; left: 16px; z-index: 9000;
      background: rgba(13, 27, 42, 0.88);
      border: 1px solid rgba(100, 181, 246, 0.3);
      border-radius: 12px; padding: 14px 18px;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #c8dff0;
      font-size: 0.82rem; line-height: 1.7;
      max-width: 280px;
      backdrop-filter: blur(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #controls-help.hidden {
      opacity: 0; transform: translateY(20px); pointer-events: none;
    }
    #controls-help h3 {
      margin: 0 0 8px; font-size: 0.95rem; color: #64b5f6; letter-spacing: 1px;
    }
    #controls-help kbd {
      display: inline-block; background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 4px;
      padding: 1px 6px; font-family: monospace; font-size: 0.78rem;
      margin: 0 2px; color: #e8f0fa;
    }
    #controls-help .section { margin-bottom: 6px; }
    #controls-help .section-title {
      color: #90caf9; font-weight: 600; font-size: 0.78rem;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px;
    }
    #controls-help .close-btn {
      position: absolute; top: 8px; right: 12px;
      background: none; border: none; color: #90caf9; cursor: pointer;
      font-size: 1.1rem; padding: 0; line-height: 1;
    }
    #controls-help .close-btn:hover { color: #fff; }
    #controls-toggle {
      position: fixed; bottom: 16px; left: 16px; z-index: 8999;
      background: rgba(13, 27, 42, 0.8); border: 1px solid rgba(100, 181, 246, 0.3);
      border-radius: 8px; padding: 8px 14px; color: #90caf9; cursor: pointer;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.82rem;
      display: none;
    }
    #controls-toggle:hover { background: rgba(30, 60, 100, 0.8); color: #fff; }

    /* Info popup */
    #info-popup {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 9500; background: rgba(13, 27, 42, 0.94);
      border: 1px solid rgba(100, 181, 246, 0.4); border-radius: 16px;
      padding: 24px 32px; max-width: 420px; color: #e0f0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: auto;
    }
    #info-popup.hidden {
      opacity: 0; transform: translate(-50%, -50%) scale(0.9);
      pointer-events: none;
    }
    #info-popup h2 { margin: 0 0 12px; color: #64b5f6; font-size: 1.3rem; }
    #info-popup p  { margin: 0; font-size: 0.95rem; line-height: 1.6; color: #c8dff0; }
    #info-popup .close-popup {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none; color: #90caf9; cursor: pointer;
      font-size: 1.3rem; padding: 0; line-height: 1;
    }
    #info-popup .close-popup:hover { color: #fff; }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-overlay">
    <h1>🌍 The Water Cycle</h1>
    <p>Loading 3D Experience…</p>
    <div class="loader"></div>
  </div>

  <!-- Controls help -->
  <div id="controls-help">
    <button class="close-btn" onclick="toggleControls(false)">×</button>
    <h3>🎮 Controls</h3>
    <div class="section">
      <div class="section-title">Desktop</div>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br>
      <kbd>←</kbd><kbd>→</kbd> Turn &nbsp;|&nbsp; Mouse: Look<br>
      Click on labels for more info
    </div>
    <div class="section">
      <div class="section-title">🎮 Gamepad (Desktop)</div>
      Left stick: Move &nbsp;|&nbsp; Right stick: Turn
    </div>
    <div class="section">
      <div class="section-title">🥽 Meta Quest 3S</div>
      Left 🕹️ Move &nbsp;|&nbsp; Right 🕹️ Snap Turn<br>
      Trigger: Select &nbsp;|&nbsp; Hand tracking supported
    </div>
  </div>
  <button id="controls-toggle" onclick="toggleControls(true)">🎮 Controls</button>

  <!-- Info popup -->
  <div id="info-popup" class="hidden">
    <button class="close-popup" onclick="closeInfoPopup()">×</button>
    <h2 id="popup-title"></h2>
    <p id="popup-text"></p>
  </div>

  <script>
    /* ================================================================ */
    /*  UI HELPERS                                                      */
    /* ================================================================ */
    function toggleControls(show) {
      var help = document.getElementById('controls-help');
      var btn = document.getElementById('controls-toggle');
      if (show) {
        help.classList.remove('hidden');
        btn.style.display = 'none';
      } else {
        help.classList.add('hidden');
        btn.style.display = 'block';
      }
    }

    var infoData = {
      'collection': {
        title: '💧 Collection',
        text: 'Water collects in oceans, lakes, rivers, and underground aquifers. About 97% of Earth\'s water is in the oceans. Lakes and rivers hold only about 0.3% of all fresh water!'
      },
      'evaporation': {
        title: '⬆️ Evaporation',
        text: 'The Sun heats water, turning it into invisible water vapor that rises into the atmosphere. About 90% of evaporation comes from oceans. Plants also release water vapor through transpiration!'
      },
      'condensation': {
        title: '☁️ Condensation',
        text: 'As water vapor rises and cools, it condenses around tiny dust particles to form water droplets. Billions of these droplets together make clouds! Temperature drops about 6.5°C per 1000m of altitude.'
      },
      'precipitation': {
        title: '⬇️ Precipitation',
        text: 'When cloud droplets combine and become heavy enough, they fall as precipitation — rain, snow, sleet, or hail. An average raindrop falls at about 14 mph (22 km/h)!'
      },
      'runoff': {
        title: '🌊 Runoff',
        text: 'Water flows over land surfaces back into rivers, lakes, and oceans. Some water seeps underground to become groundwater. Mountains and slopes channel water into streams and rivers!'
      }
    };

    function showInfoPopup(key) {
      var data = infoData[key];
      if (!data) return;
      document.getElementById('popup-title').textContent = data.title;
      document.getElementById('popup-text').textContent = data.text;
      document.getElementById('info-popup').classList.remove('hidden');
    }
    function closeInfoPopup() {
      document.getElementById('info-popup').classList.add('hidden');
    }

    /* ================================================================ */
    /*  UTILITY                                                         */
    /* ================================================================ */
    function rand(a, b) { return Math.random() * (b - a) + a; }
    function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

    /* ================================================================ */
    /*  CUSTOM VISUAL COMPONENTS                                        */
    /* ================================================================ */

    /* ── Animated water surface ────────────────────────────────────── */
    AFRAME.registerComponent('water-animation', {
      schema: { speed: { default: 0.5 }, amplitude: { default: 0.04 } },
      init: function () {
        this.baseY = this.el.getAttribute('position').y;
        this.time = 0;
      },
      tick: function (t, dt) {
        if (!dt) return;
        this.time += dt / 1000;
        var y = this.baseY + Math.sin(this.time * this.data.speed * 2) * this.data.amplitude;
        var pos = this.el.getAttribute('position');
        this.el.setAttribute('position', { x: pos.x, y: y, z: pos.z });
      }
    });

    /* ── Evaporation particles (realistic steam/mist) ──────────────── */
    AFRAME.registerComponent('evaporation-system', {
      schema: {
        count: { type: 'int', default: 60 },
        radius: { default: 4 },
        minY: { default: 0.2 },
        maxY: { default: 9 },
        speed: { default: 0.5 }
      },
      init: function () {
        this.particles = [];
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.SphereGeometry(1, 8, 6);
        var mat = new THREE.MeshStandardMaterial({
          color: 0xd4eeff, transparent: true, opacity: 0.5,
          roughness: 1, metalness: 0, depthWrite: false
        });
        for (var i = 0; i < d.count; i++) {
          var mesh = new THREE.Mesh(geom, mat.clone());
          var angle = rand(0, Math.PI * 2);
          var r = rand(0.3, d.radius);
          var p = {
            mesh: mesh,
            baseX: Math.cos(angle) * r,
            baseZ: Math.sin(angle) * r,
            y: rand(d.minY, d.maxY),
            speed: rand(d.speed * 0.4, d.speed * 1.8),
            size: rand(0.06, 0.18),
            wobbleSpeed: rand(0.3, 1.2),
            wobbleAmp: rand(0.1, 0.4),
            phase: rand(0, Math.PI * 2)
          };
          mesh.position.set(p.baseX, p.y, p.baseZ);
          mesh.scale.setScalar(p.size);
          group.add(mesh);
          this.particles.push(p);
        }
        this.el.setObject3D('particles', group);
      },
      tick: function (t, dt) {
        if (!dt) return;
        var d = this.data;
        var sec = dt / 1000;
        var time = t / 1000;
        for (var i = 0; i < this.particles.length; i++) {
          var p = this.particles[i];
          p.y += p.speed * sec;
          if (p.y > d.maxY) {
            p.y = d.minY;
            var angle = rand(0, Math.PI * 2);
            var r = rand(0.3, d.radius);
            p.baseX = Math.cos(angle) * r;
            p.baseZ = Math.sin(angle) * r;
          }
          var wobX = Math.sin(time * p.wobbleSpeed + p.phase) * p.wobbleAmp;
          var wobZ = Math.cos(time * p.wobbleSpeed * 0.7 + p.phase) * p.wobbleAmp * 0.6;
          p.mesh.position.set(p.baseX + wobX, p.y, p.baseZ + wobZ);
          var progress = (p.y - d.minY) / (d.maxY - d.minY);
          var scale = p.size * (1 + progress * 1.5);
          p.mesh.scale.setScalar(scale);
          p.mesh.material.opacity = 0.45 * (1 - progress * 0.7);
        }
      }
    });

    /* ── Rain with splash pool ─────────────────────────────────────── */
    AFRAME.registerComponent('rain-system', {
      schema: {
        count: { type: 'int', default: 150 },
        areaX: { default: 10 },
        areaZ: { default: 10 },
        minY: { default: 0 },
        maxY: { default: 10 },
        speed: { default: 7 }
      },
      init: function () {
        this.drops = [];
        this.splashes = [];
        var d = this.data;
        var group = new THREE.Group();
        var dropGeom = new THREE.CylinderGeometry(0.008, 0.008, 0.35, 3);
        var dropMat = new THREE.MeshBasicMaterial({
          color: 0x90caf9, transparent: true, opacity: 0.55
        });
        for (var i = 0; i < d.count; i++) {
          var mesh = new THREE.Mesh(dropGeom, dropMat.clone());
          var dr = {
            mesh: mesh,
            x: rand(-d.areaX / 2, d.areaX / 2),
            y: rand(d.minY, d.maxY),
            z: rand(-d.areaZ / 2, d.areaZ / 2),
            speed: rand(d.speed * 0.7, d.speed * 1.3)
          };
          mesh.position.set(dr.x, dr.y, dr.z);
          group.add(mesh);
          this.drops.push(dr);
        }
        var splashGeom = new THREE.RingGeometry(0.02, 0.06, 8);
        var splashMat = new THREE.MeshBasicMaterial({
          color: 0xbbdefb, transparent: true, opacity: 0, side: THREE.DoubleSide,
          depthWrite: false
        });
        for (var j = 0; j < 20; j++) {
          var ring = new THREE.Mesh(splashGeom.clone(), splashMat.clone());
          ring.rotation.x = -Math.PI / 2;
          ring.position.set(0, 0.06, 0);
          ring.visible = false;
          group.add(ring);
          this.splashes.push({ mesh: ring, life: 0, active: false });
        }
        this.el.setObject3D('rain', group);
        this.splashIdx = 0;
      },
      tick: function (t, dt) {
        if (!dt) return;
        var sec = dt / 1000;
        var d = this.data;
        for (var i = 0; i < this.drops.length; i++) {
          var dr = this.drops[i];
          dr.y -= dr.speed * sec;
          if (dr.y < d.minY) {
            var s = this.splashes[this.splashIdx % this.splashes.length];
            s.mesh.position.set(dr.x, 0.06, dr.z);
            s.mesh.visible = true;
            s.mesh.scale.set(1, 1, 1);
            s.mesh.material.opacity = 0.6;
            s.life = 0;
            s.active = true;
            this.splashIdx++;
            dr.y = d.maxY;
            dr.x = rand(-d.areaX / 2, d.areaX / 2);
            dr.z = rand(-d.areaZ / 2, d.areaZ / 2);
          }
          dr.mesh.position.set(dr.x, dr.y, dr.z);
        }
        for (var j = 0; j < this.splashes.length; j++) {
          var sp = this.splashes[j];
          if (!sp.active) continue;
          sp.life += sec;
          if (sp.life > 0.5) {
            sp.active = false;
            sp.mesh.visible = false;
          } else {
            var prog = sp.life / 0.5;
            sp.mesh.scale.set(1 + prog * 3, 1 + prog * 3, 1);
            sp.mesh.material.opacity = 0.6 * (1 - prog);
          }
        }
      }
    });

    /* ── Cloud float ───────────────────────────────────────────────── */
    AFRAME.registerComponent('cloud-float', {
      schema: {
        amplitude: { default: 0.3 },
        speed: { default: 0.2 },
        driftX: { default: 0.05 },
        offset: { default: 0 }
      },
      init: function () {
        var p = this.el.getAttribute('position');
        this.basePos = { x: p.x, y: p.y, z: p.z };
      },
      tick: function (t) {
        var d = this.data;
        var s = t / 1000 + d.offset;
        var y = this.basePos.y + Math.sin(s * d.speed) * d.amplitude;
        var x = this.basePos.x + Math.sin(s * d.speed * 0.4) * d.driftX * 5;
        this.el.setAttribute('position', { x: x, y: y, z: this.basePos.z });
      }
    });

    /* ── Volumetric cloud mesh ─────────────────────────────────────── */
    AFRAME.registerComponent('cloud-mesh', {
      schema: {
        scale: { default: 1 },
        density: { type: 'int', default: 14 },
        darkBottom: { default: true }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.SphereGeometry(1, 10, 8);
        for (var i = 0; i < d.density; i++) {
          var mat = new THREE.MeshStandardMaterial({
            color: 0xffffff, roughness: 1, metalness: 0,
            transparent: true, opacity: rand(0.7, 0.92), depthWrite: false
          });
          var mesh = new THREE.Mesh(geom, mat);
          var sx = rand(0.6, 1.4) * d.scale;
          var sy = rand(0.3, 0.7) * d.scale;
          var sz = rand(0.6, 1.2) * d.scale;
          mesh.scale.set(sx, sy, sz);
          mesh.position.set(
            rand(-1.5, 1.5) * d.scale,
            rand(-0.2, 0.5) * d.scale,
            rand(-0.8, 0.8) * d.scale
          );
          if (d.darkBottom && mesh.position.y < 0) {
            mat.color.setHex(0xd0d0d0);
            mat.opacity = rand(0.5, 0.7);
          }
          group.add(mesh);
        }
        this.el.setObject3D('cloud', group);
      }
    });

    /* ── Sun glow effect ───────────────────────────────────────────── */
    AFRAME.registerComponent('sun-glow', {
      init: function () {
        var group = new THREE.Group();
        var sizes = [1.8, 2.5, 3.5];
        var opacities = [0.15, 0.08, 0.04];
        var geom = new THREE.SphereGeometry(1, 16, 12);
        for (var i = 0; i < sizes.length; i++) {
          var mat = new THREE.MeshBasicMaterial({
            color: 0xfff176, transparent: true, opacity: opacities[i],
            depthWrite: false, side: THREE.BackSide
          });
          var mesh = new THREE.Mesh(geom, mat);
          mesh.scale.setScalar(sizes[i]);
          group.add(mesh);
        }
        var rayGeom = new THREE.PlaneGeometry(0.15, 5);
        var rayMat = new THREE.MeshBasicMaterial({
          color: 0xfff9c4, transparent: true, opacity: 0.06,
          depthWrite: false, side: THREE.DoubleSide
        });
        for (var r = 0; r < 8; r++) {
          var ray = new THREE.Mesh(rayGeom, rayMat.clone());
          ray.rotation.z = (r / 8) * Math.PI;
          group.add(ray);
        }
        this.el.setObject3D('glow', group);
        this.group = group;
        this.time = 0;
      },
      tick: function (t, dt) {
        if (!dt) return;
        this.time += dt / 1000;
        var pulse = 1 + Math.sin(this.time * 0.5) * 0.05;
        this.group.scale.setScalar(pulse);
      }
    });

    /* ── Procedural tree ───────────────────────────────────────────── */
    AFRAME.registerComponent('tree', {
      schema: {
        trunkHeight: { default: 2 },
        crownType: { default: 'round' },
        crownColor: { default: '#2e7d32' },
        crownSize: { default: 1 }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var trunkGeom = new THREE.CylinderGeometry(0.08, 0.12, d.trunkHeight, 6);
        var trunkMat = new THREE.MeshStandardMaterial({
          color: 0x5d4037, roughness: 0.9, metalness: 0.05, flatShading: true
        });
        var trunk = new THREE.Mesh(trunkGeom, trunkMat);
        trunk.position.y = d.trunkHeight / 2;
        trunk.castShadow = true;
        group.add(trunk);
        var crownMat = new THREE.MeshStandardMaterial({
          color: d.crownColor, roughness: 0.85, metalness: 0, flatShading: true
        });
        var crown;
        if (d.crownType === 'round') {
          crown = new THREE.Mesh(
            new THREE.DodecahedronGeometry(d.crownSize, 1), crownMat
          );
          crown.position.y = d.trunkHeight + d.crownSize * 0.5;
          crown.castShadow = true;
          group.add(crown);
        } else if (d.crownType === 'cone') {
          crown = new THREE.Mesh(
            new THREE.ConeGeometry(d.crownSize * 0.7, d.crownSize * 2.5, 6), crownMat
          );
          crown.position.y = d.trunkHeight + d.crownSize * 0.8;
          crown.castShadow = true;
          group.add(crown);
        } else {
          for (var layer = 0; layer < 3; layer++) {
            var s = d.crownSize * (1 - layer * 0.25);
            var lMesh = new THREE.Mesh(
              new THREE.ConeGeometry(s * 0.7, s * 1.2, 6), crownMat.clone()
            );
            lMesh.position.y = d.trunkHeight + layer * s * 0.7;
            lMesh.castShadow = true;
            group.add(lMesh);
          }
        }
        this.el.setObject3D('tree', group);
      }
    });

    /* ── Procedural rock ───────────────────────────────────────────── */
    AFRAME.registerComponent('rock', {
      schema: { size: { default: 0.3 }, color: { default: '#888888' } },
      init: function () {
        var geom = new THREE.DodecahedronGeometry(this.data.size, 0);
        var pos = geom.attributes.position;
        for (var i = 0; i < pos.count; i++) {
          pos.setXYZ(i,
            pos.getX(i) + rand(-0.05, 0.05) * this.data.size,
            pos.getY(i) + rand(-0.05, 0.05) * this.data.size,
            pos.getZ(i) + rand(-0.05, 0.05) * this.data.size
          );
        }
        geom.computeVertexNormals();
        var mat = new THREE.MeshStandardMaterial({
          color: this.data.color, roughness: 0.9, metalness: 0.1, flatShading: true
        });
        var mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true; mesh.receiveShadow = true;
        this.el.setObject3D('rock', mesh);
      }
    });

    /* ── Procedural mountain with snow ─────────────────────────────── */
    AFRAME.registerComponent('mountain', {
      schema: {
        radius: { default: 6 },
        height: { default: 10 },
        segments: { type: 'int', default: 7 },
        snowLine: { default: 0.7 },
        color: { default: '#5f7a61' }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.ConeGeometry(d.radius, d.height, d.segments, 3);
        var pos = geom.attributes.position;
        for (var i = 0; i < pos.count; i++) {
          var y = pos.getY(i);
          var factor = (y < 0) ? 0.6 : 0.25;
          pos.setXYZ(i,
            pos.getX(i) + rand(-d.radius * factor * 0.15, d.radius * factor * 0.15),
            pos.getY(i),
            pos.getZ(i) + rand(-d.radius * factor * 0.15, d.radius * factor * 0.15)
          );
        }
        geom.computeVertexNormals();
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.95, metalness: 0, flatShading: true
        });
        var mountain = new THREE.Mesh(geom, mat);
        mountain.position.y = d.height / 2;
        mountain.castShadow = true; mountain.receiveShadow = true;
        group.add(mountain);
        var snowH = d.height * (1 - d.snowLine);
        var snowR = d.radius * (1 - d.snowLine) * 1.15;
        var snowGeom = new THREE.ConeGeometry(snowR, snowH, d.segments, 1);
        var sp = snowGeom.attributes.position;
        for (var j = 0; j < sp.count; j++) {
          sp.setXYZ(j,
            sp.getX(j) + rand(-snowR * 0.08, snowR * 0.08),
            sp.getY(j),
            sp.getZ(j) + rand(-snowR * 0.08, snowR * 0.08)
          );
        }
        snowGeom.computeVertexNormals();
        var snowMat = new THREE.MeshStandardMaterial({
          color: 0xf5f5f5, roughness: 0.6, metalness: 0.05, flatShading: true
        });
        var snow = new THREE.Mesh(snowGeom, snowMat);
        snow.position.y = d.height * d.snowLine + snowH / 2;
        group.add(snow);
        this.el.setObject3D('mountain', group);
      }
    });

    /* ── River (tube along curve) ──────────────────────────────────── */
    AFRAME.registerComponent('river', {
      schema: {
        width: { default: 0.4 },
        points: { type: 'string', default: '0,0|5,5' }
      },
      init: function () {
        var d = this.data;
        var pts = d.points.split('|').map(function (s) {
          var xy = s.trim().split(',').map(Number);
          return new THREE.Vector3(xy[0], 0.06, xy[1]);
        });
        if (pts.length < 2) { console.warn('river: need at least 2 points'); return; }
        var curve = new THREE.CatmullRomCurve3(pts);
        var geom = new THREE.TubeGeometry(curve, 32, d.width / 2, 6, false);
        var mat = new THREE.MeshStandardMaterial({
          color: 0x1565c0, roughness: 0.2, metalness: 0.4,
          transparent: true, opacity: 0.75
        });
        var mesh = new THREE.Mesh(geom, mat);
        this.el.setObject3D('river', mesh);
      }
    });

    /* ── Cycle flow arrow (bezier tube + arrowhead) ────────────────── */
    AFRAME.registerComponent('cycle-arrow', {
      schema: {
        from: { type: 'vec3', default: { x: 0, y: 0, z: 0 } },
        to: { type: 'vec3', default: { x: 0, y: 5, z: 0 } },
        color: { default: '#29b6f6' },
        midHeight: { default: 3 }
      },
      init: function () {
        var d = this.data;
        var start = new THREE.Vector3(d.from.x, d.from.y, d.from.z);
        var end = new THREE.Vector3(d.to.x, d.to.y, d.to.z);
        var mid = new THREE.Vector3(
          (d.from.x + d.to.x) / 2,
          Math.max(d.from.y, d.to.y) + d.midHeight,
          (d.from.z + d.to.z) / 2
        );
        var curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        var tubeGeom = new THREE.TubeGeometry(curve, 24, 0.06, 5, false);
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.5, metalness: 0.3,
          transparent: true, opacity: 0.7, depthWrite: false
        });
        var tube = new THREE.Mesh(tubeGeom, mat);
        this.el.setObject3D('arrow-path', tube);
        var arrowGeom = new THREE.ConeGeometry(0.15, 0.35, 6);
        var arrowMat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.4, metalness: 0.3
        });
        var arrow = new THREE.Mesh(arrowGeom, arrowMat);
        var tangent = curve.getTangent(1);
        arrow.position.copy(end);
        arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
        this.el.setObject3D('arrow-head', arrow);
      }
    });

    /* ── Glass panel for labels ────────────────────────────────────── */
    AFRAME.registerComponent('glass-panel', {
      schema: {
        width: { default: 3 },
        height: { default: 0.5 },
        color: { default: '#e3f2fd' },
        opacity: { default: 0.5 }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var planeGeom = new THREE.PlaneGeometry(d.width, d.height);
        var planeMat = new THREE.MeshStandardMaterial({
          color: d.color, transparent: true, opacity: d.opacity,
          roughness: 0.1, metalness: 0.5, side: THREE.DoubleSide, depthWrite: false
        });
        var plane = new THREE.Mesh(planeGeom, planeMat);
        group.add(plane);
        var edgeGeom = new THREE.EdgesGeometry(planeGeom);
        var edgeMat = new THREE.LineBasicMaterial({ color: 0x90caf9, transparent: true, opacity: 0.4 });
        var edges = new THREE.LineSegments(edgeGeom, edgeMat);
        group.add(edges);
        this.el.setObject3D('glass', group);
      }
    });

    /* ── Waterfall particles ───────────────────────────────────────── */
    AFRAME.registerComponent('waterfall', {
      schema: { height: { default: 1 }, width: { default: 0.5 } },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        this.particles = [];
        var geom = new THREE.SphereGeometry(0.04, 4, 3);
        var mat = new THREE.MeshBasicMaterial({
          color: 0x90caf9, transparent: true, opacity: 0.6
        });
        for (var i = 0; i < 30; i++) {
          var mesh = new THREE.Mesh(geom, mat.clone());
          var p = {
            mesh: mesh,
            x: rand(-d.width / 2, d.width / 2),
            y: rand(0, d.height),
            z: rand(-0.05, 0.05),
            speed: rand(1.5, 3)
          };
          mesh.position.set(p.x, p.y, p.z);
          group.add(mesh);
          this.particles.push(p);
        }
        this.el.setObject3D('waterfall', group);
      },
      tick: function (t, dt) {
        if (!dt) return;
        var sec = dt / 1000;
        var d = this.data;
        for (var i = 0; i < this.particles.length; i++) {
          var p = this.particles[i];
          p.y -= p.speed * sec;
          if (p.y < 0) { p.y = d.height; p.x = rand(-d.width / 2, d.width / 2); }
          p.mesh.position.set(p.x, p.y, p.z);
          p.mesh.material.opacity = 0.3 + 0.3 * (p.y / d.height);
        }
      }
    });

    /* ── Billboard ─────────────────────────────────────────────────── */
    AFRAME.registerComponent('billboard', {
      tick: function () {
        var cam = this.el.sceneEl.camera;
        if (!cam) return;
        var camPos = new THREE.Vector3();
        cam.getWorldPosition(camPos);
        this.el.object3D.lookAt(camPos);
      }
    });

    /* ══════════════════════════════════════════════════════════════════
     *  NAVIGATION & CONTROLLER SYSTEM
     *  ────────────────────────────────────────────────────────────────
     *  Works in THREE modes simultaneously:
     *
     *  1. DESKTOP BROWSER:
     *     - WASD / Arrow keys for movement & turning
     *     - Mouse look via A-Frame's look-controls
     *     - Click labels for info popups
     *
     *  2. DESKTOP GAMEPAD (e.g. Xbox controller in Chrome):
     *     - Left stick = move (camera-relative)
     *     - Right stick = snap turn
     *     - Polls navigator.getGamepads() every frame
     *
     *  3. META QUEST 3S (WebXR):
     *     - oculus-touch-controls renders controller models
     *     - thumbstickmoved events feed into same locomotion
     *     - Custom VR laser (no conflicts with laser-controls)
     *     - Haptic feedback on trigger
     *     - Hand tracking supported
     * ══════════════════════════════════════════════════════════════════ */

    /* ── Unified locomotion ────────────────────────────────────────── */
    AFRAME.registerComponent('locomotion-controls', {
      schema: {
        speed: { default: 3.5 },
        turnSpeed: { default: 60 },
        snapTurn: { default: true },
        snapAngle: { default: 45 },
        deadzone: { default: 0.15 },
        fly: { default: false }
      },
      init: function () {
        this.moveVec = new THREE.Vector3();
        this.dirVec = new THREE.Vector3();
        this.camQuat = new THREE.Quaternion();
        this.keys = {};
        this.stickL = { x: 0, y: 0 };
        this.stickR = { x: 0, y: 0 };
        this.snapReady = true;

        var self = this;

        // Keyboard listeners
        document.addEventListener('keydown', function (e) { self.keys[e.code] = true; });
        document.addEventListener('keyup', function (e) { self.keys[e.code] = false; });

        // VR controller thumbstick events (from oculus-touch-controls)
        this.el.sceneEl.addEventListener('thumbstickmoved', function (evt) {
          var hand = self.resolveHand(evt.target);
          if (hand === 'left') {
            self.stickL.x = evt.detail.x;
            self.stickL.y = evt.detail.y;
          } else {
            self.stickR.x = evt.detail.x;
            self.stickR.y = evt.detail.y;
          }
        });
      },

      resolveHand: function (el) {
        var comps = el.components || {};
        if (comps['oculus-touch-controls']) return comps['oculus-touch-controls'].data.hand;
        if (comps['hand-controls']) return comps['hand-controls'].data.hand;
        if (comps['tracked-controls']) return comps['tracked-controls'].data.hand || '';
        if (el.id && el.id.indexOf('left') !== -1) return 'left';
        if (el.id && el.id.indexOf('right') !== -1) return 'right';
        return 'right';
      },

      tick: function (t, dt) {
        if (!dt) return;
        var d = this.data;
        var sec = dt / 1000;
        var rig = this.el;
        var cam = this.el.sceneEl.camera;
        if (!cam) return;
        var inVR = this.el.sceneEl.is('vr-mode');

        // Poll desktop gamepads when NOT in VR
        if (!inVR) this.pollGamepads();

        // ── KEYBOARD INPUT (desktop only) ──
        var kx = 0, kz = 0, kturn = 0;
        if (!inVR) {
          if (this.keys['KeyW'] || this.keys['ArrowUp']) kz = -1;
          if (this.keys['KeyS'] || this.keys['ArrowDown']) kz = 1;
          if (this.keys['KeyA'] || this.keys['KeyQ']) kx = -1;
          if (this.keys['KeyD'] || this.keys['KeyE']) kx = 1;
          if (this.keys['ArrowLeft']) kturn = 1;
          if (this.keys['ArrowRight']) kturn = -1;
        }

        // ── COMBINED MOVEMENT (keyboard + sticks) ──
        var moveX = kx + this.stickL.x;
        var moveZ = kz + this.stickL.y;

        if (Math.abs(moveX) > d.deadzone || Math.abs(moveZ) > d.deadzone) {
          cam.getWorldQuaternion(this.camQuat);
          this.dirVec.set(moveX, 0, moveZ);
          this.dirVec.applyQuaternion(this.camQuat);
          if (!d.fly) this.dirVec.y = 0;
          this.dirVec.normalize();
          var magnitude = Math.min(1, Math.sqrt(moveX * moveX + moveZ * moveZ));
          this.dirVec.multiplyScalar(d.speed * sec * magnitude);
          var pos = rig.getAttribute('position');
          rig.setAttribute('position', {
            x: pos.x + this.dirVec.x,
            y: d.fly ? pos.y + this.dirVec.y : pos.y,
            z: pos.z + this.dirVec.z
          });
        }

        // ── KEYBOARD SMOOTH TURN ──
        if (Math.abs(kturn) > 0) {
          var rot = rig.getAttribute('rotation');
          rig.setAttribute('rotation', {
            x: rot.x,
            y: rot.y + kturn * d.turnSpeed * sec,
            z: rot.z
          });
        }

        // ── STICK SNAP TURN (VR + gamepad) ──
        var turnX = this.stickR.x;
        if (d.snapTurn) {
          if (Math.abs(turnX) > 0.6 && this.snapReady) {
            var rot = rig.getAttribute('rotation');
            var angle = turnX > 0 ? -d.snapAngle : d.snapAngle;
            rig.setAttribute('rotation', { x: rot.x, y: rot.y + angle, z: rot.z });
            this.snapReady = false;
          } else if (Math.abs(turnX) < 0.3) {
            this.snapReady = true;
          }
        } else if (Math.abs(turnX) > d.deadzone) {
          var rot = rig.getAttribute('rotation');
          rig.setAttribute('rotation', {
            x: rot.x,
            y: rot.y - turnX * d.turnSpeed * sec,
            z: rot.z
          });
        }
      },

      pollGamepads: function () {
        var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (var i = 0; i < gamepads.length; i++) {
          var gp = gamepads[i];
          if (!gp) continue;
          if (gp.axes.length >= 2) {
            this.stickL.x = gp.axes[0];
            this.stickL.y = gp.axes[1];
          }
          if (gp.axes.length >= 4) {
            this.stickR.x = gp.axes[2];
            this.stickR.y = gp.axes[3];
          }
          break;
        }
      }
    });

    /* ── VR laser pointer (visible only in VR)  ────────────────────── */
    AFRAME.registerComponent('vr-laser', {
      schema: {
        color: { default: '#ffffff' },
        length: { default: 5 },
        opacity: { default: 0.4 }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        // Beam
        var laserGeom = new THREE.CylinderGeometry(0.002, 0.002, d.length, 4);
        laserGeom.translate(0, -d.length / 2, 0);
        laserGeom.rotateX(Math.PI / 2);
        var laserMat = new THREE.MeshBasicMaterial({
          color: d.color, transparent: true, opacity: d.opacity, depthWrite: false
        });
        this.laser = new THREE.Mesh(laserGeom, laserMat);
        group.add(this.laser);
        // Dot
        var dotGeom = new THREE.SphereGeometry(0.012, 8, 6);
        var dotMat = new THREE.MeshBasicMaterial({
          color: d.color, transparent: true, opacity: 0.8, depthWrite: false
        });
        this.dot = new THREE.Mesh(dotGeom, dotMat);
        this.dot.position.set(0, 0, -d.length);
        group.add(this.dot);
        this.group = group;
        this.el.setObject3D('vr-laser', group);
        group.visible = false;
      },
      tick: function () {
        var inVR = this.el.sceneEl.is('vr-mode');
        this.group.visible = inVR;
        if (inVR) {
          var raycaster = this.el.components.raycaster;
          if (raycaster && raycaster.intersections && raycaster.intersections.length > 0) {
            var dist = raycaster.intersections[0].distance;
            this.dot.position.set(0, 0, -dist);
            this.laser.scale.set(1, 1, dist / this.data.length);
          } else {
            this.dot.position.set(0, 0, -this.data.length);
            this.laser.scale.set(1, 1, 1);
          }
        }
      }
    });

    /* ── VR haptic feedback ────────────────────────────────────────── */
    AFRAME.registerComponent('vr-haptics', {
      init: function () {
        var el = this.el;
        el.addEventListener('triggerdown', function () {
          var tc = el.components['tracked-controls'];
          if (tc && tc.controller) {
            var gp = tc.controller.gamepad || tc.controller;
            if (gp && gp.hapticActuators && gp.hapticActuators.length > 0) {
              gp.hapticActuators[0].pulse(0.4, 80);
            }
            if (tc.controller.hapticActuators && tc.controller.hapticActuators.length > 0) {
              tc.controller.hapticActuators[0].pulse(0.4, 80);
            }
          }
        });
      }
    });

    /* ── Interactive label click handler ────────────────────────────── */
    AFRAME.registerComponent('info-label', {
      schema: { key: { type: 'string', default: '' } },
      init: function () {
        var self = this;
        this.el.classList.add('clickable');
        this.el.addEventListener('click', function () {
          showInfoPopup(self.data.key);
        });
        this.el.addEventListener('mouseenter', function () {
          self.el.setAttribute('scale', '1.1 1.1 1.1');
        });
        this.el.addEventListener('mouseleave', function () {
          self.el.setAttribute('scale', '1 1 1');
        });
      }
    });

    /* ── Loading screen dismiss ────────────────────────────────────── */
    AFRAME.registerComponent('dismiss-loader', {
      init: function () {
        var overlay = document.getElementById('loading-overlay');
        if (overlay) {
          setTimeout(function () {
            overlay.classList.add('fade-out');
            setTimeout(function () { overlay.remove(); }, 900);
          }, 2000);
        }
      }
    });

    /* ── Cabin ─────────────────────────────────────────────────────── */
    AFRAME.registerComponent('cabin', {
      init: function () {
        var group = new THREE.Group();
        var wallGeom = new THREE.BoxGeometry(1.6, 1.2, 1.4);
        var wallMat = new THREE.MeshStandardMaterial({
          color: 0x8d6e63, roughness: 0.9, metalness: 0.05, flatShading: true
        });
        var walls = new THREE.Mesh(wallGeom, wallMat);
        walls.position.y = 0.6;
        walls.castShadow = true; walls.receiveShadow = true;
        group.add(walls);
        var roofGeom = new THREE.ConeGeometry(1.3, 0.8, 4);
        var roofMat = new THREE.MeshStandardMaterial({
          color: 0xc62828, roughness: 0.8, metalness: 0.1, flatShading: true
        });
        var roof = new THREE.Mesh(roofGeom, roofMat);
        roof.position.y = 1.6; roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        var doorGeom = new THREE.PlaneGeometry(0.35, 0.6);
        var doorMat = new THREE.MeshStandardMaterial({
          color: 0x4e342e, roughness: 0.9, side: THREE.DoubleSide
        });
        var door = new THREE.Mesh(doorGeom, doorMat);
        door.position.set(0, 0.35, 0.71);
        group.add(door);
        var winGeom = new THREE.PlaneGeometry(0.25, 0.25);
        var winMat = new THREE.MeshStandardMaterial({
          color: 0xbbdefb, roughness: 0.1, metalness: 0.5, side: THREE.DoubleSide
        });
        var win1 = new THREE.Mesh(winGeom, winMat);
        win1.position.set(0.45, 0.7, 0.71);
        group.add(win1);
        var win2 = new THREE.Mesh(winGeom, winMat.clone());
        win2.position.set(-0.45, 0.7, 0.71);
        group.add(win2);
        var chimGeom = new THREE.BoxGeometry(0.2, 0.6, 0.2);
        var chimMat = new THREE.MeshStandardMaterial({
          color: 0x795548, roughness: 0.9, flatShading: true
        });
        var chim = new THREE.Mesh(chimGeom, chimMat);
        chim.position.set(0.4, 1.9, 0);
        group.add(chim);
        this.el.setObject3D('cabin', group);
      }
    });

    /* ── Fence ─────────────────────────────────────────────────────── */
    AFRAME.registerComponent('fence', {
      schema: { length: { default: 6 }, posts: { type: 'int', default: 6 } },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var postGeom = new THREE.CylinderGeometry(0.04, 0.05, 0.7, 5);
        var postMat = new THREE.MeshStandardMaterial({
          color: 0x795548, roughness: 0.9, metalness: 0.05
        });
        var railGeom = new THREE.CylinderGeometry(0.02, 0.02, d.length / d.posts, 4);
        var railMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.9 });
        for (var i = 0; i < d.posts; i++) {
          var post = new THREE.Mesh(postGeom, postMat);
          var x = (i / (d.posts - 1)) * d.length - d.length / 2;
          post.position.set(x, 0.35, 0);
          post.castShadow = true;
          group.add(post);
          if (i < d.posts - 1) {
            var rail = new THREE.Mesh(railGeom, railMat);
            rail.rotation.z = Math.PI / 2;
            rail.position.set(x + d.length / d.posts / 2, 0.5, 0);
            group.add(rail);
            var rail2 = new THREE.Mesh(railGeom.clone(), railMat.clone());
            rail2.rotation.z = Math.PI / 2;
            rail2.position.set(x + d.length / d.posts / 2, 0.25, 0);
            group.add(rail2);
          }
        }
        this.el.setObject3D('fence', group);
      }
    });

    /* ── Dock ──────────────────────────────────────────────────────── */
    AFRAME.registerComponent('dock', {
      init: function () {
        var group = new THREE.Group();
        var plankMat = new THREE.MeshStandardMaterial({
          color: 0x8d6e63, roughness: 0.9, metalness: 0.05
        });
        for (var i = 0; i < 8; i++) {
          var plank = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 0.06, 0.22), plankMat
          );
          plank.position.set(0, 0.4, -i * 0.28);
          plank.castShadow = true;
          group.add(plank);
        }
        var pillarGeom = new THREE.CylinderGeometry(0.06, 0.07, 0.8, 5);
        var pillarMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 });
        var pillars = [[-0.5, 0], [0.5, 0], [-0.5, -1.2], [0.5, -1.2], [-0.5, -2], [0.5, -2]];
        pillars.forEach(function (p) {
          var pillar = new THREE.Mesh(pillarGeom, pillarMat);
          pillar.position.set(p[0], 0.1, p[1]);
          group.add(pillar);
        });
        this.el.setObject3D('dock', group);
      }
    });
  </script>

  <!-- ================================================================ -->
  <!--  SCENE                                                            -->
  <!-- ================================================================ -->
  <a-scene
    dismiss-loader
    vr-mode-ui="enabled: true"
    webxr="requiredFeatures: local-floor;
           optionalFeatures: bounded-floor, hand-tracking, layers;
           referenceSpaceType: local-floor"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;
              sortObjects: true; toneMapping: ACESFilmic; toneMappingExposure: 1.1"
    shadow="type: pcfsoft; autoUpdate: true"
    fog="type: exponential; color: #b8d8f0; density: 0.012"
    background="color: #87CEEB"
  >
    <a-assets id="scene-assets" timeout="15000">
      <a-asset-item id="duck-model"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck/glTF-Binary/Duck.glb"></a-asset-item>
    </a-assets>

    <!-- ── Sky ───────────────────────────────────────────────────── -->
    <a-sky color="#78b9e2"></a-sky>
    <a-sphere radius="48" position="0 -5 0"
              material="shader:flat; color:#5da0d0; side:back; opacity:0.3;
                        transparent:true; depthWrite:false"></a-sphere>

    <!-- ── Lighting ──────────────────────────────────────────────── -->
    <a-light type="ambient" color="#b4c8dc" intensity="0.5"></a-light>
    <a-light id="sun-light" type="directional" color="#fff4d6" intensity="1.5"
             position="8 14 -6" castShadow="true"
             shadow="mapSize:2048 2048; bias:-0.001; normalBias:0.02"></a-light>
    <a-light type="hemisphere" color="#87ceeb" groundColor="#4a7c3f" intensity="0.35"></a-light>
    <a-light type="directional" color="#c4d8e8" intensity="0.25" position="-6 8 4"></a-light>

    <!-- ═══════════════════════════════════════════════════════════════
         PLAYER RIG — unified locomotion for Desktop + Gamepad + VR
         ═══════════════════════════════════════════════════════════════ -->
    <a-entity id="rig" position="0 0 14"
              locomotion-controls="speed:3.5; snapTurn:true; snapAngle:45">

      <!-- Camera (auto-switches between desktop & VR headset) -->
      <a-camera id="head" position="0 1.6 0"
                look-controls="pointerLockEnabled:false"
                wasd-controls="enabled:false">
        <!-- Desktop mouse ray cursor -->
        <a-entity id="desktop-cursor"
                  cursor="fuse:false; rayOrigin:mouse"
                  raycaster="objects:.clickable; far:30"></a-entity>
        <!-- Gaze reticle (visible as small dot in center) -->
        <a-entity id="gaze-reticle" position="0 0 -1"
                  geometry="primitive:ring; radiusInner:0.008; radiusOuter:0.013"
                  material="shader:flat; color:#ffffff; opacity:0.5;
                            depthTest:false; transparent:true"></a-entity>
      </a-camera>

      <!-- ════════════════════════════════════════════════════════════
           LEFT CONTROLLER — Meta Quest 3S (Touch Plus)
           Thumbstick → movement (via locomotion-controls)
           Trigger → select / interact
           ════════════════════════════════════════════════════════════ -->
      <a-entity id="left-controller"
                oculus-touch-controls="hand:left; model:true"
                vr-laser="color:#42a5f5; length:5; opacity:0.35"
                vr-haptics
                raycaster="objects:.clickable; far:8;
                           showLine:false;
                           origin:0 0 0; direction:0 0 -1"></a-entity>

      <!-- ════════════════════════════════════════════════════════════
           RIGHT CONTROLLER — Meta Quest 3S (Touch Plus)
           Thumbstick → snap turn (via locomotion-controls)
           Trigger → select / interact
           ════════════════════════════════════════════════════════════ -->
      <a-entity id="right-controller"
                oculus-touch-controls="hand:right; model:true"
                vr-laser="color:#ef5350; length:5; opacity:0.35"
                vr-haptics
                raycaster="objects:.clickable; far:8;
                           showLine:false;
                           origin:0 0 0; direction:0 0 -1"></a-entity>
