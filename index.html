<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Cycle – WebVR Educational App</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b3a5c 50%, #2a5f8f 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e0f0ff;
      transition: opacity 0.8s ease;
    }
    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    #loading-overlay h1 { font-size: 2.2rem; margin-bottom: 0.3em; letter-spacing: 2px; }
    #loading-overlay p  { font-size: 1rem; opacity: 0.7; margin-bottom: 2em; }
    .loader { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.15);
              border-top-color: #64b5f6; border-radius: 50%;
              animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-overlay">
    <h1>🌍 The Water Cycle</h1>
    <p>Loading 3D Experience…</p>
    <div class="loader"></div>
  </div>

  <script>
    /* ================================================================ */
    /*  HELPERS                                                         */
    /* ================================================================ */
    function rand(a, b) { return Math.random() * (b - a) + a; }
    function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

    /* ================================================================ */
    /*  CUSTOM COMPONENTS                                               */
    /* ================================================================ */

    /* ── Animated water surface ────────────────────────────────────── */
    AFRAME.registerComponent('water-animation', {
      schema: { speed: { default: 0.5 }, amplitude: { default: 0.04 } },
      init: function () {
        this.baseY = this.el.getAttribute('position').y;
        this.time = 0;
      },
      tick: function (t, dt) {
        if (!dt) return;
        this.time += dt / 1000;
        var y = this.baseY + Math.sin(this.time * this.data.speed * 2) * this.data.amplitude;
        var pos = this.el.getAttribute('position');
        this.el.setAttribute('position', { x: pos.x, y: y, z: pos.z });
      }
    });

    /* ── Evaporation particles (realistic steam/mist) ──────────────── */
    AFRAME.registerComponent('evaporation-system', {
      schema: {
        count: { type: 'int', default: 60 },
        radius: { default: 4 },
        minY: { default: 0.2 },
        maxY: { default: 9 },
        speed: { default: 0.5 }
      },
      init: function () {
        this.particles = [];
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.SphereGeometry(1, 8, 6);
        var mat = new THREE.MeshStandardMaterial({
          color: 0xd4eeff, transparent: true, opacity: 0.5,
          roughness: 1, metalness: 0, depthWrite: false
        });
        for (var i = 0; i < d.count; i++) {
          var mesh = new THREE.Mesh(geom, mat.clone());
          var angle = rand(0, Math.PI * 2);
          var r = rand(0.3, d.radius);
          var p = {
            mesh: mesh,
            baseX: Math.cos(angle) * r,
            baseZ: Math.sin(angle) * r,
            y: rand(d.minY, d.maxY),
            speed: rand(d.speed * 0.4, d.speed * 1.8),
            size: rand(0.06, 0.18),
            wobbleSpeed: rand(0.3, 1.2),
            wobbleAmp: rand(0.1, 0.4),
            phase: rand(0, Math.PI * 2)
          };
          mesh.position.set(p.baseX, p.y, p.baseZ);
          mesh.scale.setScalar(p.size);
          group.add(mesh);
          this.particles.push(p);
        }
        this.el.setObject3D('particles', group);
      },
      tick: function (t, dt) {
        if (!dt) return;
        var d = this.data;
        var sec = dt / 1000;
        var ts = t / 1000;
        for (var i = 0; i < this.particles.length; i++) {
          var p = this.particles[i];
          p.y += p.speed * sec;
          var progress = (p.y - d.minY) / (d.maxY - d.minY);
          var scale = p.size * (1 + progress * 2.5);
          p.mesh.scale.setScalar(scale);
          p.mesh.material.opacity = Math.max(0, 0.45 * (1 - progress * progress));
          var wobX = Math.sin(ts * p.wobbleSpeed + p.phase) * p.wobbleAmp;
          var wobZ = Math.cos(ts * p.wobbleSpeed * 0.7 + p.phase) * p.wobbleAmp * 0.6;
          p.mesh.position.set(p.baseX + wobX, p.y, p.baseZ + wobZ);
          if (p.y >= d.maxY) {
            p.y = d.minY;
            var angle = rand(0, Math.PI * 2);
            var r = rand(0.3, d.radius);
            p.baseX = Math.cos(angle) * r;
            p.baseZ = Math.sin(angle) * r;
            p.speed = rand(d.speed * 0.4, d.speed * 1.8);
          }
        }
      }
    });

    /* ── Rain system (realistic falling drops with splashes) ───────── */
    AFRAME.registerComponent('rain-system', {
      schema: {
        count: { type: 'int', default: 120 },
        areaX: { default: 14 },
        areaZ: { default: 14 },
        minY: { default: 0.05 },
        maxY: { default: 10 },
        speed: { default: 8 }
      },
      init: function () {
        this.drops = [];
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.CylinderGeometry(0.008, 0.015, 0.35, 4);
        var mat = new THREE.MeshStandardMaterial({
          color: 0x88bbee, transparent: true, opacity: 0.45,
          roughness: 0.1, metalness: 0.3, depthWrite: false
        });
        for (var i = 0; i < d.count; i++) {
          var mesh = new THREE.Mesh(geom, mat.clone());
          var drop = {
            mesh: mesh,
            x: rand(-d.areaX / 2, d.areaX / 2),
            z: rand(-d.areaZ / 2, d.areaZ / 2),
            y: rand(d.minY, d.maxY),
            speed: rand(d.speed * 0.6, d.speed * 1.4),
            opacity: rand(0.25, 0.55)
          };
          mesh.position.set(drop.x, drop.y, drop.z);
          mesh.material.opacity = drop.opacity;
          group.add(mesh);
          this.drops.push(drop);
        }
        this.el.setObject3D('rain', group);

        // Splash rings
        this.splashes = [];
        var ringGeom = new THREE.RingGeometry(0.01, 0.08, 8);
        var ringMat = new THREE.MeshStandardMaterial({
          color: 0xaaddff, transparent: true, opacity: 0.5,
          roughness: 1, metalness: 0, side: THREE.DoubleSide, depthWrite: false
        });
        this.splashGroup = new THREE.Group();
        for (var j = 0; j < 20; j++) {
          var ring = new THREE.Mesh(ringGeom.clone(), ringMat.clone());
          ring.rotation.x = -Math.PI / 2;
          ring.visible = false;
          this.splashGroup.add(ring);
          this.splashes.push({ mesh: ring, life: 0, active: false });
        }
        this.el.setObject3D('splashes', this.splashGroup);
        this.splashIdx = 0;
      },
      spawnSplash: function(x, z) {
        var s = this.splashes[this.splashIdx];
        s.mesh.position.set(x, 0.08, z);
        s.mesh.scale.setScalar(0.3);
        s.mesh.material.opacity = 0.5;
        s.mesh.visible = true;
        s.life = 0; s.active = true;
        this.splashIdx = (this.splashIdx + 1) % this.splashes.length;
      },
      tick: function (t, dt) {
        if (!dt) return;
        var d = this.data;
        var sec = dt / 1000;
        for (var i = 0; i < this.drops.length; i++) {
          var p = this.drops[i];
          p.y -= p.speed * sec;
          if (p.y <= d.minY) {
            if (Math.random() < 0.3) this.spawnSplash(p.x, p.z);
            p.y = d.maxY + rand(0, 2);
            p.x = rand(-d.areaX / 2, d.areaX / 2);
            p.z = rand(-d.areaZ / 2, d.areaZ / 2);
          }
          p.mesh.position.set(p.x, p.y, p.z);
        }
        for (var j = 0; j < this.splashes.length; j++) {
          var s = this.splashes[j];
          if (!s.active) continue;
          s.life += sec;
          var progress = s.life / 0.5;
          if (progress >= 1) { s.active = false; s.mesh.visible = false; continue; }
          s.mesh.scale.setScalar(0.3 + progress * 2);
          s.mesh.material.opacity = 0.5 * (1 - progress);
        }
      }
    });

    /* ── Gentle floating for clouds ────────────────────────────────── */
    AFRAME.registerComponent('cloud-float', {
      schema: {
        amplitude: { default: 0.3 },
        speed: { default: 0.3 },
        driftX: { default: 0.1 },
        offset: { default: 0 }
      },
      init: function () {
        var pos = this.el.getAttribute('position');
        this.baseY = pos.y;
        this.baseX = pos.x;
      },
      tick: function (t) {
        var d = this.data;
        var ts = t / 1000;
        var pos = this.el.getAttribute('position');
        var newY = this.baseY + Math.sin(ts * d.speed + d.offset) * d.amplitude;
        var newX = this.baseX + Math.sin(ts * d.driftX + d.offset * 2) * 0.3;
        this.el.setAttribute('position', { x: newX, y: newY, z: pos.z });
      }
    });

    /* ── Volumetric cloud builder ──────────────────────────────────── */
    AFRAME.registerComponent('cloud-mesh', {
      schema: {
        scale: { default: 1 },
        density: { type: 'int', default: 12 },
        darkBottom: { default: true }
      },
      init: function () {
        var group = new THREE.Group();
        var d = this.data;
        for (var i = 0; i < d.density; i++) {
          var r = rand(0.4, 1.1) * d.scale;
          var geom = new THREE.SphereGeometry(r, 12, 8);
          var brightness = d.darkBottom ? rand(0.88, 1) : 1;
          var col = new THREE.Color(brightness, brightness, brightness);
          var mat = new THREE.MeshStandardMaterial({
            color: col, roughness: 1, metalness: 0,
            transparent: true, opacity: rand(0.82, 0.95),
            depthWrite: false
          });
          var mesh = new THREE.Mesh(geom, mat);
          mesh.position.set(
            rand(-1.5, 1.5) * d.scale,
            rand(-0.2, 0.7) * d.scale + (i === 0 ? 0 : rand(-0.1, 0.4)),
            rand(-0.6, 0.6) * d.scale
          );
          if (d.darkBottom && mesh.position.y < 0.2 * d.scale) {
            mesh.material.color.setRGB(0.82, 0.84, 0.88);
          }
          group.add(mesh);
        }
        this.el.setObject3D('cloud', group);
      }
    });

    /* ── Sun glow & pulse ──────────────────────────────────────────── */
    AFRAME.registerComponent('sun-glow', {
      init: function () {
        var group = new THREE.Group();
        var layers = [
          { r: 1.8, opacity: 0.12, color: 0xfff176 },
          { r: 2.5, opacity: 0.06, color: 0xffe082 },
          { r: 3.5, opacity: 0.03, color: 0xffcc80 }
        ];
        layers.forEach(function(l) {
          var geom = new THREE.SphereGeometry(l.r, 16, 12);
          var mat = new THREE.MeshBasicMaterial({
            color: l.color, transparent: true, opacity: l.opacity,
            depthWrite: false, side: THREE.BackSide
          });
          group.add(new THREE.Mesh(geom, mat));
        });
        for (var i = 0; i < 8; i++) {
          var rayGeom = new THREE.PlaneGeometry(0.15, 2.5);
          var rayMat = new THREE.MeshBasicMaterial({
            color: 0xffe082, transparent: true, opacity: 0.15,
            depthWrite: false, side: THREE.DoubleSide
          });
          var ray = new THREE.Mesh(rayGeom, rayMat);
          ray.rotation.z = (i / 8) * Math.PI;
          group.add(ray);
        }
        this.el.setObject3D('glow', group);
      },
      tick: function (t) {
        var s = 1 + Math.sin(t / 1200) * 0.06;
        var glow = this.el.getObject3D('glow');
        if (glow) glow.scale.setScalar(s);
        var mesh = this.el.getObject3D('mesh');
        if (mesh) {
          var ps = 1 + Math.sin(t / 800) * 0.03;
          mesh.scale.setScalar(ps);
        }
      }
    });

    /* ── Procedural low-poly tree ──────────────────────────────────── */
    AFRAME.registerComponent('tree', {
      schema: {
        trunkHeight: { default: 2 },
        trunkRadius: { default: 0.15 },
        crownType: { default: 'round' },
        crownColor: { default: '#2e7d32' },
        crownSize: { default: 1.2 }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        // Trunk
        var trunkGeom = new THREE.CylinderGeometry(d.trunkRadius * 0.6, d.trunkRadius, d.trunkHeight, 6);
        var trunkMat = new THREE.MeshStandardMaterial({
          color: 0x5d4037, roughness: 0.9, metalness: 0.05
        });
        var trunk = new THREE.Mesh(trunkGeom, trunkMat);
        trunk.position.y = d.trunkHeight / 2;
        trunk.castShadow = true;
        group.add(trunk);

        var crownY = d.trunkHeight;
        var color = new THREE.Color(d.crownColor);

        if (d.crownType === 'round') {
          var sizes = [d.crownSize, d.crownSize * 0.8, d.crownSize * 0.7];
          var offsets = [[0, 0, 0], [0.3, 0.3, 0.2], [-0.3, 0.2, -0.1]];
          for (var i = 0; i < 3; i++) {
            var sg = new THREE.SphereGeometry(sizes[i], 8, 6);
            var sm = new THREE.MeshStandardMaterial({
              color: color.clone().offsetHSL(0, 0, rand(-0.05, 0.05)),
              roughness: 0.85, metalness: 0
            });
            var sphere = new THREE.Mesh(sg, sm);
            sphere.position.set(offsets[i][0], crownY + sizes[i] * 0.6 + offsets[i][1], offsets[i][2]);
            sphere.castShadow = true;
            group.add(sphere);
          }
        } else if (d.crownType === 'cone') {
          var coneG = new THREE.ConeGeometry(d.crownSize, d.crownSize * 2.5, 6);
          var coneM = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8, metalness: 0 });
          var cone = new THREE.Mesh(coneG, coneM);
          cone.position.y = crownY + d.crownSize * 1.2;
          cone.castShadow = true;
          group.add(cone);
          var cone2G = new THREE.ConeGeometry(d.crownSize * 0.7, d.crownSize * 1.8, 6);
          var cone2M = new THREE.MeshStandardMaterial({
            color: color.clone().offsetHSL(0.02, 0, 0.05), roughness: 0.8, metalness: 0
          });
          var cone2 = new THREE.Mesh(cone2G, cone2M);
          cone2.position.y = crownY + d.crownSize * 2.2;
          cone2.castShadow = true;
          group.add(cone2);
        } else if (d.crownType === 'layered') {
          for (var j = 0; j < 3; j++) {
            var lr = d.crownSize * (1 - j * 0.25);
            var lh = d.crownSize * 0.6;
            var layerG = new THREE.ConeGeometry(lr, lh, 7);
            var layerM = new THREE.MeshStandardMaterial({
              color: color.clone().offsetHSL(0, 0, j * 0.04),
              roughness: 0.8, metalness: 0
            });
            var layer = new THREE.Mesh(layerG, layerM);
            layer.position.y = crownY + j * lh * 0.65 + lr * 0.3;
            layer.castShadow = true;
            group.add(layer);
          }
        }
        this.el.setObject3D('tree', group);
      }
    });

    /* ── Procedural rock ───────────────────────────────────────────── */
    AFRAME.registerComponent('rock', {
      schema: { size: { default: 0.5 }, color: { default: '#757575' } },
      init: function () {
        var d = this.data;
        var geom = new THREE.DodecahedronGeometry(d.size, 0);
        var pos = geom.attributes.position;
        for (var i = 0; i < pos.count; i++) {
          pos.setXYZ(i,
            pos.getX(i) * rand(0.8, 1.2),
            pos.getY(i) * rand(0.7, 1.1),
            pos.getZ(i) * rand(0.8, 1.2)
          );
        }
        geom.computeVertexNormals();
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.95, metalness: 0.05, flatShading: true
        });
        var mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true; mesh.receiveShadow = true;
        this.el.setObject3D('rock', mesh);
      }
    });

    /* ── Mountain mesh (low-poly) ──────────────────────────────────── */
    AFRAME.registerComponent('mountain', {
      schema: {
        radius: { default: 6 }, height: { default: 10 },
        segments: { type: 'int', default: 6 },
        snowLine: { default: 0.7 }, color: { default: '#5f7a61' }
      },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.ConeGeometry(d.radius, d.height, d.segments);
        var pos = geom.attributes.position;
        for (var i = 0; i < pos.count; i++) {
          var y = pos.getY(i);
          if (y < d.height * 0.4) {
            pos.setX(i, pos.getX(i) * rand(0.85, 1.15));
            pos.setZ(i, pos.getZ(i) * rand(0.85, 1.15));
          }
        }
        geom.computeVertexNormals();
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.9, metalness: 0.05, flatShading: true
        });
        var mtn = new THREE.Mesh(geom, mat);
        mtn.position.y = d.height / 2;
        mtn.castShadow = true; mtn.receiveShadow = true;
        group.add(mtn);

        // Snow cap
        var snowH = d.height * (1 - d.snowLine);
        var snowR = d.radius * (1 - d.snowLine) * 1.15;
        var snowGeom = new THREE.ConeGeometry(snowR, snowH, d.segments);
        var snowPos = snowGeom.attributes.position;
        for (var j = 0; j < snowPos.count; j++) {
          snowPos.setX(j, snowPos.getX(j) * rand(0.9, 1.1));
          snowPos.setZ(j, snowPos.getZ(j) * rand(0.9, 1.1));
        }
        snowGeom.computeVertexNormals();
        var snowMat = new THREE.MeshStandardMaterial({
          color: 0xf0f4f8, roughness: 0.7, metalness: 0.1, flatShading: true
        });
        var snow = new THREE.Mesh(snowGeom, snowMat);
        snow.position.y = d.height * d.snowLine + snowH / 2;
        group.add(snow);

        this.el.setObject3D('mountain', group);
      }
    });

    /* ── River/stream on ground ────────────────────────────────────── */
    AFRAME.registerComponent('river', {
      schema: { width: { default: 0.6 }, points: { default: '' } },
      init: function () {
        var d = this.data;
        var pts = d.points.split(';').map(function(p) {
          var xy = p.trim().split(',');
          return new THREE.Vector3(parseFloat(xy[0]), 0.06, parseFloat(xy[1]));
        });
        if (pts.length < 2) return;
        var curve = new THREE.CatmullRomCurve3(pts);
        var tubeGeom = new THREE.TubeGeometry(curve, 30, d.width / 2, 6, false);
        var mat = new THREE.MeshStandardMaterial({
          color: 0x2196f3, roughness: 0.2, metalness: 0.3,
          transparent: true, opacity: 0.75
        });
        var mesh = new THREE.Mesh(tubeGeom, mat);
        this.el.setObject3D('river', mesh);
      }
    });

    /* ── 3D cycle arrow ────────────────────────────────────────────── */
    AFRAME.registerComponent('cycle-arrow', {
      schema: {
        from: { type: 'vec3' }, to: { type: 'vec3' },
        color: { default: '#29b6f6' }, midHeight: { default: 2 }
      },
      init: function () {
        var d = this.data;
        var mid = new THREE.Vector3(
          (d.from.x + d.to.x) / 2,
          Math.max(d.from.y, d.to.y) + d.midHeight,
          (d.from.z + d.to.z) / 2
        );
        var curve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(d.from.x, d.from.y, d.from.z), mid,
          new THREE.Vector3(d.to.x, d.to.y, d.to.z)
        );
        var tubeGeom = new THREE.TubeGeometry(curve, 20, 0.05, 6, false);
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.5, metalness: 0.2,
          transparent: true, opacity: 0.7
        });
        this.el.setObject3D('arrow-path', new THREE.Mesh(tubeGeom, mat));
        // Arrowhead
        var dir = curve.getTangentAt(1).normalize();
        var coneGeom = new THREE.ConeGeometry(0.15, 0.4, 6);
        var coneMat = new THREE.MeshStandardMaterial({
          color: d.color, roughness: 0.5, metalness: 0.2,
          transparent: true, opacity: 0.8
        });
        var cone = new THREE.Mesh(coneGeom, coneMat);
        cone.position.copy(new THREE.Vector3(d.to.x, d.to.y, d.to.z));
        var quat = new THREE.Quaternion();
        quat.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
        cone.setRotationFromQuaternion(quat);
        this.el.setObject3D('arrow-head', cone);
      }
    });

    /* ── Glass label panel ─────────────────────────────────────────── */
    AFRAME.registerComponent('glass-panel', {
      schema: {
        width: { default: 2 }, height: { default: 0.5 },
        color: { default: '#ffffff' }, opacity: { default: 0.55 }
      },
      init: function () {
        var d = this.data;
        var geom = new THREE.PlaneGeometry(d.width, d.height, 1, 1);
        // rounded corners via shape
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, transparent: true, opacity: d.opacity,
          roughness: 0.1, metalness: 0.3, side: THREE.DoubleSide,
          depthWrite: false
        });
        var mesh = new THREE.Mesh(geom, mat);
        var edges = new THREE.EdgesGeometry(geom);
        var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
          color: 0x90caf9, transparent: true, opacity: 0.4
        }));
        var group = new THREE.Group();
        group.add(mesh); group.add(line);
        this.el.setObject3D('panel', group);
      }
    });

    /* ── Waterfall particles ───────────────────────────────────────── */
    AFRAME.registerComponent('waterfall', {
      schema: { height: { default: 3 }, width: { default: 0.8 } },
      init: function () {
        this.particles = [];
        var d = this.data;
        var group = new THREE.Group();
        var geom = new THREE.SphereGeometry(0.04, 4, 3);
        var mat = new THREE.MeshStandardMaterial({
          color: 0x90caf9, transparent: true, opacity: 0.6,
          roughness: 0.2, metalness: 0.1, depthWrite: false
        });
        for (var i = 0; i < 40; i++) {
          var mesh = new THREE.Mesh(geom, mat.clone());
          var p = {
            mesh: mesh,
            x: rand(-d.width/2, d.width/2),
            y: rand(0, d.height),
            z: rand(-0.1, 0.1),
            speed: rand(2, 4)
          };
          mesh.position.set(p.x, p.y, p.z);
          group.add(mesh);
          this.particles.push(p);
        }
        this.el.setObject3D('waterfall', group);
      },
      tick: function(t, dt) {
        if (!dt) return;
        var sec = dt / 1000;
        var d = this.data;
        for (var i = 0; i < this.particles.length; i++) {
          var p = this.particles[i];
          p.y -= p.speed * sec;
          if (p.y < 0) { p.y = d.height; p.x = rand(-d.width/2, d.width/2); }
          p.mesh.position.set(p.x, p.y, p.z);
          p.mesh.material.opacity = 0.3 + 0.3 * (p.y / d.height);
        }
      }
    });

    /* ── Billboard ─────────────────────────────────────────────────── */
    AFRAME.registerComponent('billboard', {
      tick: function () {
        var cam = this.el.sceneEl.camera;
        if (!cam) return;
        var camPos = new THREE.Vector3();
        cam.getWorldPosition(camPos);
        this.el.object3D.lookAt(camPos);
      }
    });

    /* ── Thumbstick locomotion (Quest 3S controllers) ──────────────── */
    AFRAME.registerComponent('thumbstick-locomotion', {
      schema: {
        speed: { default: 3 },
        fly: { default: false },
        deadzone: { default: 0.15 },
        turnSpeed: { default: 2 },
        snapTurn: { default: true },
        snapAngle: { default: 45 }
      },
      init: function () {
        this.moveVec = new THREE.Vector3();
        this.dirVec = new THREE.Vector3();
        this.camQuat = new THREE.Quaternion();
        this.stickL = { x: 0, y: 0 };
        this.stickR = { x: 0, y: 0 };
        this.snapReady = true;
        this.setupControllerListeners();
      },
      setupControllerListeners: function () {
        var self = this;
        var scene = this.el.sceneEl;
        // Listen for thumbstick events from both controllers
        scene.addEventListener('thumbstickmoved', function (evt) {
          var hand = evt.target.getAttribute('tracked-controls') ||
                     evt.target.getAttribute('oculus-touch-controls') ||
                     evt.target.getAttribute('hand-controls') || {};
          var handId = hand.hand || '';
          // Also check component names
          if (!handId) {
            if (evt.target.id && evt.target.id.indexOf('left') !== -1) handId = 'left';
            else if (evt.target.id && evt.target.id.indexOf('right') !== -1) handId = 'right';
            else {
              // Try to determine from controller index
              var comps = evt.target.components;
              if (comps && comps['oculus-touch-controls']) handId = comps['oculus-touch-controls'].data.hand;
              else if (comps && comps['hand-controls']) handId = comps['hand-controls'].data.hand;
            }
          }
          if (handId === 'left') {
            self.stickL.x = evt.detail.x;
            self.stickL.y = evt.detail.y;
          } else {
            self.stickR.x = evt.detail.x;
            self.stickR.y = evt.detail.y;
          }
        });
      },
      tick: function (t, dt) {
        if (!dt || !this.el.sceneEl.is('vr-mode')) return;
        var d = this.data;
        var sec = dt / 1000;
        var rig = this.el;
        var cam = this.el.sceneEl.camera;
        if (!cam) return;
        // ── LEFT STICK: movement (forward/back/strafe) ──
        var lx = this.stickL.x;
        var ly = this.stickL.y;
        if (Math.abs(lx) > d.deadzone || Math.abs(ly) > d.deadzone) {
          // Get camera world direction
          cam.getWorldQuaternion(this.camQuat);
          this.dirVec.set(lx, 0, ly);
          this.dirVec.applyQuaternion(this.camQuat);
          if (!d.fly) this.dirVec.y = 0;
          this.dirVec.normalize();
          var magnitude = Math.min(1, Math.sqrt(lx * lx + ly * ly));
          this.dirVec.multiplyScalar(d.speed * sec * magnitude);
          var pos = rig.getAttribute('position');
          rig.setAttribute('position', {
            x: pos.x + this.dirVec.x,
            y: d.fly ? pos.y + this.dirVec.y : pos.y,
            z: pos.z + this.dirVec.z
          });
        }
        // ── RIGHT STICK: snap turn (horizontal) ──
        var rx = this.stickR.x;
        if (d.snapTurn) {
          if (Math.abs(rx) > 0.6 && this.snapReady) {
            var rot = rig.getAttribute('rotation');
            var angle = rx > 0 ? -d.snapAngle : d.snapAngle;
            rig.setAttribute('rotation', { x: rot.x, y: rot.y + angle, z: rot.z });
            this.snapReady = false;
          } else if (Math.abs(rx) < 0.3) {
            this.snapReady = true;
          }
        } else {
          if (Math.abs(rx) > d.deadzone) {
            var rot = rig.getAttribute('rotation');
            rig.setAttribute('rotation', { x: rot.x, y: rot.y - rx * d.turnSpeed, z: rot.z });
          }
        }
      }
    });

    /* ── Controller laser pointer ──────────────────────────────────── */
    AFRAME.registerComponent('controller-laser', {
      schema: {
        color: { default: '#ffffff' },
        length: { default: 5 },
        opacity: { default: 0.4 }
      },
      init: function () {
        var d = this.data;
        // Laser beam
        var laserGeom = new THREE.CylinderGeometry(0.002, 0.002, d.length, 4);
        laserGeom.translate(0, -d.length / 2, 0);
        laserGeom.rotateX(Math.PI / 2);
        var laserMat = new THREE.MeshBasicMaterial({
          color: d.color, transparent: true, opacity: d.opacity, depthWrite: false
        });
        this.laser = new THREE.Mesh(laserGeom, laserMat);
        this.el.setObject3D('laser', this.laser);

        // Dot at end of laser
        var dotGeom = new THREE.SphereGeometry(0.015, 8, 6);
        var dotMat = new THREE.MeshBasicMaterial({
          color: d.color, transparent: true, opacity: 0.8, depthWrite: false
        });
        this.dot = new THREE.Mesh(dotGeom, dotMat);
        this.dot.position.set(0, 0, -d.length);
        this.el.setObject3D('laser-dot', this.dot);
      },
      tick: function () {
        // Visibility only in VR
        var inVR = this.el.sceneEl.is('vr-mode');
        if (this.laser) this.laser.visible = inVR;
        if (this.dot) this.dot.visible = inVR;
      }
    });

    /* ── Controller haptic feedback on trigger ─────────────────────── */
    AFRAME.registerComponent('controller-haptics', {
      init: function () {
        var self = this;
        this.el.addEventListener('triggerdown', function () {
          var tc = self.el.components['tracked-controls'];
          if (tc && tc.controller && tc.controller.hapticActuators &&
              tc.controller.hapticActuators.length > 0) {
            tc.controller.hapticActuators[0].pulse(0.4, 50);
          }
          // WebXR haptics
          if (tc && tc.controller && tc.controller.gamepad &&
              tc.controller.gamepad.hapticActuators) {
            var actuators = tc.controller.gamepad.hapticActuators;
            if (actuators.length > 0) actuators[0].pulse(0.4, 50);
          }
        });
      }
    });

    /* ── Keyboard locomotion for desktop VR emulation ──────────────── */
    AFRAME.registerComponent('keyboard-locomotion', {
      schema: {
        speed: { default: 3 },
        turnSpeed: { default: 60 }
      },
      init: function () {
        this.keys = {};
        var self = this;
        document.addEventListener('keydown', function(e) { self.keys[e.code] = true; });
        document.addEventListener('keyup', function(e) { self.keys[e.code] = false; });
        this.moveDir = new THREE.Vector3();
        this.camQuat = new THREE.Quaternion();
      },
      tick: function (t, dt) {
        if (!dt) return;
        // Only active outside VR (wasd-controls handles desktop, this is supplementary)
        if (this.el.sceneEl.is('vr-mode')) return;
        // Arrow keys for rotation
        var sec = dt / 1000;
        var rot = this.el.getAttribute('rotation');
        if (this.keys['ArrowLeft']) {
          this.el.setAttribute('rotation', { x: rot.x, y: rot.y + this.data.turnSpeed * sec, z: rot.z });
        }
        if (this.keys['ArrowRight']) {
          this.el.setAttribute('rotation', { x: rot.x, y: rot.y - this.data.turnSpeed * sec, z: rot.z });
        }
      }
    });

    /* ── Loading screen dismiss ────────────────────────────────────── */
    AFRAME.registerComponent('dismiss-loader', {
      init: function () {
        var overlay = document.getElementById('loading-overlay');
        if (overlay) {
          setTimeout(function() {
            overlay.classList.add('fade-out');
            setTimeout(function() { overlay.remove(); }, 900);
          }, 2000);
        }
      }
    });

    /* ── Cabin / small house ───────────────────────────────────────── */
    AFRAME.registerComponent('cabin', {
      init: function () {
        var group = new THREE.Group();
        // Walls
        var wallGeom = new THREE.BoxGeometry(1.6, 1.2, 1.4);
        var wallMat = new THREE.MeshStandardMaterial({
          color: 0x8d6e63, roughness: 0.9, metalness: 0.05, flatShading: true
        });
        var walls = new THREE.Mesh(wallGeom, wallMat);
        walls.position.y = 0.6;
        walls.castShadow = true; walls.receiveShadow = true;
        group.add(walls);
        // Roof
        var roofGeom = new THREE.ConeGeometry(1.3, 0.8, 4);
        var roofMat = new THREE.MeshStandardMaterial({
          color: 0xc62828, roughness: 0.8, metalness: 0.1, flatShading: true
        });
        var roof = new THREE.Mesh(roofGeom, roofMat);
        roof.position.y = 1.6;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        // Door
        var doorGeom = new THREE.PlaneGeometry(0.35, 0.6);
        var doorMat = new THREE.MeshStandardMaterial({
          color: 0x4e342e, roughness: 0.9, side: THREE.DoubleSide
        });
        var door = new THREE.Mesh(doorGeom, doorMat);
        door.position.set(0, 0.35, 0.71);
        group.add(door);
        // Window
        var winGeom = new THREE.PlaneGeometry(0.25, 0.25);
        var winMat = new THREE.MeshStandardMaterial({
          color: 0xbbdefb, roughness: 0.1, metalness: 0.5, side: THREE.DoubleSide
        });
        var win1 = new THREE.Mesh(winGeom, winMat);
        win1.position.set(0.45, 0.7, 0.71);
        group.add(win1);
        var win2 = new THREE.Mesh(winGeom, winMat.clone());
        win2.position.set(-0.45, 0.7, 0.71);
        group.add(win2);
        // Chimney
        var chimGeom = new THREE.BoxGeometry(0.2, 0.6, 0.2);
        var chimMat = new THREE.MeshStandardMaterial({
          color: 0x795548, roughness: 0.9, flatShading: true
        });
        var chim = new THREE.Mesh(chimGeom, chimMat);
        chim.position.set(0.4, 1.9, 0);
        group.add(chim);
        this.el.setObject3D('cabin', group);
      }
    });

    /* ── Fence posts ───────────────────────────────────────────────── */
    AFRAME.registerComponent('fence', {
      schema: { length: { default: 6 }, posts: { type: 'int', default: 6 } },
      init: function () {
        var d = this.data;
        var group = new THREE.Group();
        var postGeom = new THREE.CylinderGeometry(0.04, 0.05, 0.7, 5);
        var postMat = new THREE.MeshStandardMaterial({
          color: 0x795548, roughness: 0.9, metalness: 0.05
        });
        var railGeom = new THREE.CylinderGeometry(0.02, 0.02, d.length / d.posts, 4);
        var railMat = new THREE.MeshStandardMaterial({
          color: 0x8d6e63, roughness: 0.9
        });
        for (var i = 0; i < d.posts; i++) {
          var post = new THREE.Mesh(postGeom, postMat);
          var x = (i / (d.posts - 1)) * d.length - d.length / 2;
          post.position.set(x, 0.35, 0);
          post.castShadow = true;
          group.add(post);
          if (i < d.posts - 1) {
            var rail = new THREE.Mesh(railGeom, railMat);
            rail.rotation.z = Math.PI / 2;
            rail.position.set(x + d.length / d.posts / 2, 0.5, 0);
            group.add(rail);
            var rail2 = new THREE.Mesh(railGeom.clone(), railMat.clone());
            rail2.rotation.z = Math.PI / 2;
            rail2.position.set(x + d.length / d.posts / 2, 0.25, 0);
            group.add(rail2);
          }
        }
        this.el.setObject3D('fence', group);
      }
    });

    /* ── Dock/pier ─────────────────────────────────────────────────── */
    AFRAME.registerComponent('dock', {
      init: function () {
        var group = new THREE.Group();
        var plankMat = new THREE.MeshStandardMaterial({
          color: 0x8d6e63, roughness: 0.9, metalness: 0.05
        });
        // Planks
        for (var i = 0; i < 8; i++) {
          var plank = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 0.06, 0.22),
            plankMat
          );
          plank.position.set(0, 0.4, -i * 0.28);
          plank.castShadow = true;
          group.add(plank);
        }
        // Support pillars
        var pillarGeom = new THREE.CylinderGeometry(0.06, 0.07, 0.8, 5);
        var pillarMat = new THREE.MeshStandardMaterial({
          color: 0x5d4037, roughness: 0.9
        });
        var pillars = [[-0.5, 0], [0.5, 0], [-0.5, -1.2], [0.5, -1.2], [-0.5, -2], [0.5, -2]];
        pillars.forEach(function(p) {
          var pillar = new THREE.Mesh(pillarGeom, pillarMat);
          pillar.position.set(p[0], 0.1, p[1]);
          group.add(pillar);
        });
        this.el.setObject3D('dock', group);
      }
    });
  </script>
